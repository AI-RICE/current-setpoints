name: Ruff Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v1
        with:
          args: "check --output-format=github ."
          
      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v1
        with:
          args: "format --check ."