[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "current-setpoints"
version = "0.1.0"
description = "A library for calculating optimal current setpoints for PMSM drives using analytical and neural models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Tereza Matasova", email = "matasovt@fel.zcu.cz" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Drive control",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",          
    "scikit-learn",   
    "matplotlib",    
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]