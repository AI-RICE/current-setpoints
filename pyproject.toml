[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "current-setpoints"
version = "0.1.0"
description = "A library for calculating optimal current setpoints for PMSM drives using analytical and neural models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tereza Matasova", email = "matasovt@fel.zcu.cz" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Drive control",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",          
    "scikit-learn",   
    "matplotlib",    
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"  # Replaced black and flake8 with ruff
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 88

extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["current_setpoints"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"